<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Test 10: content injected after long delay</title>
</head>
<body>
<script>
// Body is empty at parse time; content added after 10s
setTimeout(function() {
  document.body.innerHTML = '<h1>Loaded after 10s</h1>';
}, 10000);
</script>
</body>
</html>
